name = "chatze-hub"
main = "src/server/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application" }

# ==============================================================================
# Cloudflare D1 Database Binding
# ⚡ ZERO-EFFORT SETUP: Run `npm run setup` or `npm run deploy:auto` in your terminal!
# It will automatically create your Cloudflare D1 database, apply migrations,
# seed merchants, and fill in the real database_id with ZERO manual copy-pasting!
# ==============================================================================
[[d1_databases]]
binding = "DB"
database_name = "chatze-hub-db"
database_id = "auto" # Auto-populated on `npm run setup` or `npm run deploy:auto`

[vars]
ENVIRONMENT = "production"
HUB_NAME = "Chatze Hub Gateway (Nepal)"
# Google OAuth 2.0 Web Client ID (Optional: leave blank or set in .env)
GOOGLE_CLIENT_ID = ""
JWT_SECRET = "chatze-hub-default-jwt-secret-replace-in-production"

# ------------------------------------------------------------------------------
# NOTE: If you prefer the 10-Database Sharding architecture instead of single DB,
# simply run:
#   npm run setup:sharded
# It will automatically create all 10 databases and fill all 10 IDs automatically!
# ------------------------------------------------------------------------------
